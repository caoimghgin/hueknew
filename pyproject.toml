[project]
name = "hueknew"
version = "1.0.0"
description = "How many colors can the human eye actually see? A rigorous computational enumeration."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Kevin Muldoon" },
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "colorspacious>=1.1",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "psutil>=5.9",
    "starlette>=0.36.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["census"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
