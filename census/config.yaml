# Chromatic Census Configuration

grid:
  L_min: 0.0
  L_max: 100.0
  L_step: 0.25

  a_min: -128.0
  a_max: 127.0
  a_step: 0.5

  b_min: -128.0
  b_max: 127.0
  b_step: 0.5

gamut:
  illuminant: D65
  observer: 2deg
  boundary_tolerance: 0.001

packing:
  thresholds:
    - name: perceptible
      delta_e: 0.5
      description: "Perceptible under ideal side-by-side viewing conditions"
    - name: JND
      delta_e: 1.0
      description: "Theoretical limit of human color discrimination"
    - name: acceptability
      delta_e: 2.0
      description: "Meaningfully different — would be rejected in color matching"
    - name: obvious
      delta_e: 5.0
      description: "Obviously different to anyone under normal viewing"
  kdtree_radius: 6.0
  kdtree_rebuild_interval: 10000
  processing_order: L_slices

delta_e:
  formula: CIEDE2000
  k_L: 1.0
  k_C: 1.0
  k_H: 1.0

persistence:
  checkpoint_interval: 300
  checkpoint_dir: output/checkpoints
  results_db: output/results.sqlite

reporting:
  snapshot_interval: 3600
  snapshot_dir: output/snapshots
  log_level: INFO
  show_eta: true
  status_file: output/status.json

performance:
  num_workers: 4
  chunk_size: 1000
  use_vectorized_delta_e: true

dashboard:
  enabled: true
  host: "0.0.0.0"
  port: 8084
  poll_interval_seconds: 5
