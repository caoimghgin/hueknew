<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chromatic Census — Interactive Gamut Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #777777; color: #ccc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 16px 20px; border-radius: 8px;
    backdrop-filter: blur(8px); max-width: 320px;
    pointer-events: none;
  }
  #hud h1 { font-size: 14px; color: #fff; margin-bottom: 4px; font-weight: 600; }
  #hud p { font-size: 12px; color: #999; line-height: 1.5; }
  #hud .count { color: #fff; font-variant-numeric: tabular-nums; }
  #controls {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px;
    backdrop-filter: blur(8px); font-size: 12px;
  }
  #controls label { display: block; margin-bottom: 8px; color: #999; }
  #controls input[type=range] { width: 180px; vertical-align: middle; }
  #controls .val { color: #fff; display: inline-block; width: 32px; text-align: right; }
  #tier-picker {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 8px;
    backdrop-filter: blur(8px); font-size: 12px;
  }
  #tier-picker button {
    display: block; width: 100%; padding: 6px 12px; margin-bottom: 4px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #ccc; border-radius: 4px; cursor: pointer; font-size: 12px; text-align: left;
  }
  #tier-picker button:hover { background: rgba(255,255,255,0.15); }
  #tier-picker button.active { background: rgba(255,255,255,0.2); color: #fff; border-color: rgba(255,255,255,0.4); }
  #camera-info {
    position: fixed; bottom: 16px; right: 16px; z-index: 10;
    background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 8px;
    backdrop-filter: blur(8px); font-size: 11px; color: #666;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="hud">
  <h1>Chromatic Census — Gamut Viewer</h1>
  <p>Every obviously distinguishable color: <span class="count" id="seed-count">—</span> seeds</p>
  <p style="margin-top: 6px; color: #666;">Drag to orbit · Scroll to zoom · Right-drag to pan</p>
</div>

<div id="controls">
  <label>Point size <input type="range" id="size-slider" min="0.5" max="8" step="0.25" value="2.5"> <span class="val" id="size-val">2.5</span></label>
  <label>Opacity <input type="range" id="alpha-slider" min="0.1" max="1.0" step="0.05" value="1.0"> <span class="val" id="alpha-val">1.0</span></label>
</div>

<div id="tier-picker">
  <div style="color:#999;font-size:10px;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;">MacAdam-fixed (coarse)</div>
  <button class="active" data-tier="macadam-obvious">Obvious — MacAdam (39,164)</button>
  <button data-tier="macadam-jnd">JND — MacAdam (196,942)</button>
  <div style="color:#666;font-size:10px;margin:8px 0 6px;text-transform:uppercase;letter-spacing:0.5px;">Original (unfixed)</div>
  <button data-tier="obvious">Obvious — Original (17,313)</button>
  <button data-tier="jnd">JND — Original (321,930)</button>
</div>

<div id="camera-info">Camera: <span id="cam-pos">—</span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Data paths (relative to this HTML file) ---
const TIER_FILES = {
  'macadam-obvious': '../exports/coarse-macadam-obvious.csv',
  'macadam-jnd': '../exports/coarse-macadam-jnd.csv',
  obvious: '../exports/chromatic-census-ultrafine-obvious-de5.0.csv',
  acceptability: '../exports/chromatic-census-ultrafine-acceptability-de2.0.csv',
  jnd: '../exports/chromatic-census-ultrafine-jnd-de1.0.csv',
};

// --- Scene setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x777777);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(80, 60, 120);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 50, 0);  // Look at mid-lightness
controls.update();

// --- State ---
let currentPoints = null;
let currentTier = 'obvious';
let pointSize = 2.5;
let pointAlpha = 1.0;
const tierCache = {};

// --- Parse CSV text into point cloud data ---
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const header = lines[0].split(',');
  const iL = header.indexOf('L');
  const ia = header.indexOf('a');
  const ib = header.indexOf('b');
  const iHex = header.indexOf('hex_srgb');

  const count = lines.length - 1;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const tmpColor = new THREE.Color();

  for (let i = 1; i <= count; i++) {
    const cols = lines[i].split(',');
    const L = parseFloat(cols[iL]);
    const a = parseFloat(cols[ia]);
    const b = parseFloat(cols[ib]);
    const hex = cols[iHex];

    // Map CIELAB to 3D: a* → x, b* → z, L* → y (height)
    const idx = (i - 1) * 3;
    positions[idx]     = a;       // x = a*
    positions[idx + 1] = L;       // y = L* (height = lightness)
    positions[idx + 2] = b;       // z = b*

    tmpColor.set(hex);
    colors[idx]     = tmpColor.r;
    colors[idx + 1] = tmpColor.g;
    colors[idx + 2] = tmpColor.b;
  }

  return { positions, colors, count };
}

// --- Create/update point cloud ---
function buildPointCloud(data) {
  if (currentPoints) {
    scene.remove(currentPoints);
    currentPoints.geometry.dispose();
    currentPoints.material.dispose();
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(data.positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(data.colors, 3));

  const material = new THREE.PointsMaterial({
    size: pointSize,
    vertexColors: true,
    sizeAttenuation: true,
    transparent: true,
    opacity: pointAlpha,
    depthWrite: pointAlpha > 0.95,
  });

  currentPoints = new THREE.Points(geometry, material);
  scene.add(currentPoints);

  document.getElementById('seed-count').textContent = data.count.toLocaleString();
}

// --- Load tier ---
async function loadTier(tier) {
  if (tierCache[tier]) {
    buildPointCloud(tierCache[tier]);
    return;
  }

  document.getElementById('seed-count').textContent = 'loading…';

  const resp = await fetch(TIER_FILES[tier]);
  const text = await resp.text();
  const data = parseCSV(text);
  tierCache[tier] = data;
  buildPointCloud(data);
}

// --- UI wiring ---
const sizeSlider = document.getElementById('size-slider');
const sizeVal = document.getElementById('size-val');
sizeSlider.addEventListener('input', () => {
  pointSize = parseFloat(sizeSlider.value);
  sizeVal.textContent = pointSize.toFixed(1);
  if (currentPoints) currentPoints.material.size = pointSize;
});

const alphaSlider = document.getElementById('alpha-slider');
const alphaVal = document.getElementById('alpha-val');
alphaSlider.addEventListener('input', () => {
  pointAlpha = parseFloat(alphaSlider.value);
  alphaVal.textContent = pointAlpha.toFixed(2);
  if (currentPoints) {
    currentPoints.material.opacity = pointAlpha;
    currentPoints.material.depthWrite = pointAlpha > 0.95;
  }
});

document.querySelectorAll('#tier-picker button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('#tier-picker button.active').classList.remove('active');
    btn.classList.add('active');
    currentTier = btn.dataset.tier;
    loadTier(currentTier);
  });
});

// --- Camera info display ---
const camInfo = document.getElementById('cam-pos');
function updateCamInfo() {
  const p = camera.position;
  const d = p.length();
  // Compute spherical angles for reference
  const elev = Math.asin(p.y / d) * (180 / Math.PI);
  const azim = Math.atan2(p.x, p.z) * (180 / Math.PI);
  camInfo.textContent = `elev ${elev.toFixed(0)}° azim ${azim.toFixed(0)}° dist ${d.toFixed(0)}`;
}

// --- Resize ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --- Animate ---
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  updateCamInfo();
  renderer.render(scene, camera);
}

// --- L* axis rod at a*=0, b*=0 from L*=0 to L*=100 ---
const rodGeom = new THREE.CylinderGeometry(0.3, 0.3, 100, 8);
const rodMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
const rod = new THREE.Mesh(rodGeom, rodMat);
rod.position.set(0, 50, 0);  // center at L*=50, a*=0, b*=0
scene.add(rod);

// --- Boot ---
loadTier('macadam-obvious');
animate();
</script>
</body>
</html>
